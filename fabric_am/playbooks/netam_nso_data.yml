- name: Configure device
  hosts:
    - fabric_site_nso
  connection: local
  gather_facts: no

  vars:
    service: "{{service_type}}"
    operation: "{{service_action}}"

  tasks:
  - name: Create idipa service
    cisco.nso.nso_config:
      url: "{{ url }}"
      username: "{{ username }}"
      password: "{{ password }}"
      data:
        tailf-ncs:services:
          idipa:idipa:
          - name: "{{ service_name }}"
            group:
              service: "{{ service }}"
    when: (service == 'l2ptp' or service == 'l2sts' or service == 'l3rt' or service == 'l3vpn') and operation == 'create'

  - name: Create network service
    cisco.nso.nso_config:
      url: "{{ url }}"
      username: "{{ username }}"
      password: "{{ password }}"
      data: "{{ data }}"
    when: operation == 'create'

  - name: Delete network service
    cisco.nso.nso_config:
      url: "{{ url }}"
      username: "{{ username }}"
      password: "{{ password }}"
      data: "{{ data }}"
    when: operation == 'delete'


  - name: Delete idipa service - upon modify
    cisco.nso.nso_config:
      url: "{{ url }}"
      username: "{{ username }}"
      password: "{{ password }}"
      data:
        tailf-ncs:services:
          idipa:idipa:
          - name: "{{ service_name }}"
            __state: absent
    when: (service == 'l2ptp' or service == 'l2sts' or service == 'l3rt' or service == 'l3vpn') and operation == 'modify'

  - name: Modify network service - delete first
    cisco.nso.nso_config:
      url: "{{ url }}"
      username: "{{ username }}"
      password: "{{ password }}"
      data: "{{ data_delete }}"
    when: operation == 'modify'

  - name: Create idipa service - create again
    cisco.nso.nso_config:
      url: "{{ url }}"
      username: "{{ username }}"
      password: "{{ password }}"
      data:
        tailf-ncs:services:
          idipa:idipa:
          - name: "{{ service_name }}"
            group:
              service: "{{ service }}"
    when: (service == 'l2ptp' or service == 'l2sts' or service == 'l3rt' or service == 'l3vpn') and operation == 'modify'

  - name: Modify network service - create again
    cisco.nso.nso_config:
      url: "{{ url }}"
      username: "{{ username }}"
      password: "{{ password }}"
      data: "{{ data_create }}"
    when: operation == 'modify'

  - name: Delete idipa service
    cisco.nso.nso_config:
      url: "{{ url }}"
      username: "{{ username }}"
      password: "{{ password }}"
      data:
        tailf-ncs:services:
          idipa:idipa:
          - name: "{{ service_name }}"
            __state: absent
    when: (service == 'l2ptp' or service == 'l2sts' or service == 'l3rt' or service == 'l3vpn') and operation == 'delete'
